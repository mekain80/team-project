name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    name: Run Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.title, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(join(github.event.issue.labels.*.name, ','), 'claude')
      ))
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 12
            --append-system-prompt "You are working in this repository as an implementation agent. When asked to implement a GitHub issue, make the smallest correct code change, run relevant checks when possible, commit your changes, push a branch, and open a draft pull request with a clear Korean summary. Do not modify GitHub Actions workflow files unless the user explicitly asks for workflow changes."
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(npm:*),Bash(pnpm:*),Bash(pytest:*),Bash(python -m pytest:*)"
